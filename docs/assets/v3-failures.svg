<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="该有提醒却没有：ReAct 0，EGAA 14，Always Refresh 14。过期写入：1、4、14。">
  <title>StateBench v3 两类失败</title>
  <rect width="760" height="250" fill="#ffffff"/>
  <text x="24" y="30" fill="#1c1917" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">失败落在两层</text>
  <text x="24" y="52" fill="#57534e" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13">次数按原因计，一条轨迹可以有多个原因。缺提醒两边一样多，过期写入才分开。</text>
  <text x="190" y="84" text-anchor="middle" fill="#44403c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13">该有提醒却没有</text>
  <text x="540" y="84" text-anchor="middle" fill="#44403c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13">过期写入</text>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#1c1917">
    <rect x="130" y="188" width="32" height="6" rx="2" fill="#1e3a5f"/>
    <text x="146" y="180" text-anchor="middle">0</text>
    <rect x="178" y="100" width="32" height="94" rx="2" fill="#3f6212"/>
    <text x="194" y="92" text-anchor="middle">14</text>
    <rect x="226" y="100" width="32" height="94" rx="2" fill="#9a3412"/>
    <text x="242" y="92" text-anchor="middle">14</text>
    <rect x="480" y="186" width="32" height="8" rx="2" fill="#1e3a5f"/>
    <text x="496" y="178" text-anchor="middle">1</text>
    <rect x="528" y="164" width="32" height="30" rx="2" fill="#3f6212"/>
    <text x="544" y="156" text-anchor="middle">4</text>
    <rect x="576" y="100" width="32" height="94" rx="2" fill="#9a3412"/>
    <text x="592" y="92" text-anchor="middle">14</text>
  </g>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#57534e">
    <rect x="250" y="224" width="12" height="12" rx="2" fill="#1e3a5f"/>
    <text x="268" y="234">ReAct</text>
    <rect x="330" y="224" width="12" height="12" rx="2" fill="#3f6212"/>
    <text x="348" y="234">EGAA</text>
    <rect x="410" y="224" width="12" height="12" rx="2" fill="#9a3412"/>
    <text x="428" y="234">Always Refresh</text>
  </g>
</svg>
