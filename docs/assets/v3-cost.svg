  <line x1="72" y1="240" x2="220" y2="240" stroke="#e7e5e4"/>
  <line x1="306" y1="240" x2="454" y2="240" stroke="#e7e5e4"/>
  <line x1="538" y1="240" x2="686" y2="240" stroke="#e7e5e4"/>
